<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title"><title id="title">Обновление памяти и выхода LSTM: роль трёх вентилей и кандидата</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#455a64"/></marker><marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d83988"/></marker></defs><rect width="1100" height="640" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="550" y="39" font-size="24" fill="#455a64" text-anchor="middle" font-weight="600">LSTM: сохранить память, записать новое, показать выход</text><rect x="35" y="110" width="160" height="80" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="115" y="144" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Старая память</text><text x="115" y="174" font-size="26" fill="#455a64" text-anchor="middle" font-weight="400">cₜ₋₁</text><rect x="275" y="110" width="205" height="80" rx="10" fill="#fff7d5" stroke="#455a64" stroke-width="1.7"/><text x="377" y="144" font-size="26" fill="#455a64" text-anchor="middle" font-weight="400">⊙ fₜ</text><text x="377" y="174" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">сохранить долю</text><path d="M202,150 L262,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><path d="M488,150 L641,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><circle cx="670" cy="150" r="26" fill="white" stroke="#455a64" stroke-width="2"/><text x="670" y="159" font-size="29" fill="#455a64" text-anchor="middle" font-weight="400">+</text><path d="M704,150 L848,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="110" width="195" height="80" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="958" y="144" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Новая память</text><text x="958" y="174" font-size="26" fill="#455a64" text-anchor="middle" font-weight="400">cₜ</text><rect x="450" y="270" width="270" height="85" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="585" y="305" font-size="25" fill="#455a64" text-anchor="middle" font-weight="400">iₜ ⊙ gₜ</text><text x="585" y="335" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">управляемая новая запись</text><path d="M585,270 L585,230 L670,230 L670,182" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="240" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ</text><rect x="35" y="410" width="160" height="75" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="115" y="455" font-size="26" fill="#455a64" text-anchor="middle" font-weight="400">cₜ</text><path d="M205,447 L262,447" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="410" width="205" height="75" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="377" y="455" font-size="25" fill="#455a64" text-anchor="middle" font-weight="400">tanh(cₜ)</text><path d="M490,447 L570,447" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="410" width="205" height="75" rx="10" fill="#f9e5ef" stroke="#455a64" stroke-width="1.7"/><text x="687" y="442" font-size="25" fill="#455a64" text-anchor="middle" font-weight="400">⊙ oₜ</text><text x="687" y="470" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">показать долю</text><path d="M800,447 L850,447" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="410" width="195" height="75" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="958" y="440" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Выход блока</text><text x="958" y="471" font-size="26" fill="#455a64" text-anchor="middle" font-weight="400">hₜ</text><text x="550" y="545" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">fₜ, iₜ, oₜ = sigmoid(...): три вентиля со значениями от 0 до 1.</text><text x="550" y="577" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">gₜ = tanh(...): кандидат новой информации со значениями от −1 до 1.</text><text x="550" y="611" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">Все четыре блока получают uₜ = [hₜ₋₁; xₜ] и имеют собственные веса.</text></g></svg>