idth="260" height="64" rx="9" fill="none" stroke="#455a64" stroke-width="1.5"/><rect x="697" y="240" width="260" height="64" rx="9" fill="none" stroke="#455a64" stroke-width="1.5"/><rect x="697" y="305" width="260" height="64" rx="9" fill="none" stroke="#455a64" stroke-width="1.5"/><text x="832" y="415" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">У каждой строки свои μ и v</text><text x="550" y="468" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">Пример для полносвязного представления: B = 3 объекта, d = 4 признака.</text><text x="550" y="500" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Вычисленные статистики используются в (x − μ) / √(v + ε), затем применяются γ и β.</text></g></svg>