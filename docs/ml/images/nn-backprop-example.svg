<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-labelledby="title"><title id="title">Пример backpropagation с численными значениями и градиентами</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#455a64"/></marker><marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d83988"/></marker></defs><rect width="1100" height="525" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="550" y="37" font-size="25" fill="#455a64" text-anchor="middle" font-weight="600">Одна сеть: прямой и обратный проход</text><text x="48" y="75" font-size="18" fill="#455a64" text-anchor="start" font-weight="400">Вычисляем значения →</text><rect x="40" y="100" width="110" height="100" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="95.0" y="137" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">Вход</text><text x="95.0" y="174" font-size="23" fill="#455a64" text-anchor="middle" font-weight="600">x = 1</text><path d="M158,150 L198,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="100" width="190" height="100" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="305.0" y="137" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">w₁x + b₁</text><text x="305.0" y="174" font-size="23" fill="#455a64" text-anchor="middle" font-weight="600">z = 2</text><path d="M408,150 L458,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="100" width="140" height="100" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="540.0" y="137" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">ReLU(z)</text><text x="540.0" y="174" font-size="23" fill="#455a64" text-anchor="middle" font-weight="600">h = 2</text><path d="M618,150 L668,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="100" width="190" height="100" rx="10" fill="#dceef7" stroke="#455a64" stroke-width="1.7"/><text x="775.0" y="137" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">w₂h + b₂</text><text x="775.0" y="174" font-size="23" fill="#455a64" text-anchor="middle" font-weight="600">ŷ = 6</text><path d="M878,150 L918,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/><rect x="930" y="100" width="135" height="100" rx="10" fill="#fff7d5" stroke="#455a64" stroke-width="1.7"/><text x="997.5" y="137" font-size="19" fill="#455a64" text-anchor="middle" font-weight="400">½(ŷ − 4)²</text><text x="997.5" y="174" font-size="23" fill="#455a64" text-anchor="middle" font-weight="600">L = 2</text><text x="305" y="225" font-size="16" fill="#455a64" text-anchor="middle" font-weight="400">w₁ = 2, b₁ = 0</text><text x="775" y="225" font-size="16" fill="#455a64" text-anchor="middle" font-weight="400">w₂ = 3, b₂ = 0</text><text x="1055" y="270" font-size="18" fill="#d83988" text-anchor="end" font-weight="400">← Передаём производные итоговой потери</text><rect x="40" y="294" width="110" height="65" rx="10" fill="#fff5f9" stroke="#d83988" stroke-width="1.7"/><text x="95.0" y="334" font-size="16" fill="#d83988" text-anchor="middle" font-weight="400">∂L/∂x = 12</text><path d="M202,326 L162,326" fill="none" stroke="#d83988" stroke-width="2" marker-end="url(#pink)"/><rect x="210" y="294" width="190" height="65" rx="10" fill="#fff5f9" stroke="#d83988" stroke-width="1.7"/><text x="305.0" y="334" font-size="16" fill="#d83988" text-anchor="middle" font-weight="400">∂L/∂z = 6</text><path d="M462,326 L412,326" fill="none" stroke="#d83988" stroke-width="2" marker-end="url(#pink)"/><rect x="470" y="294" width="140" height="65" rx="10" fill="#fff5f9" stroke="#d83988" stroke-width="1.7"/><text x="540.0" y="334" font-size="16" fill="#d83988" text-anchor="middle" font-weight="400">∂L/∂h = 6</text><path d="M672,326 L622,326" fill="none" stroke="#d83988" stroke-width="2" marker-end="url(#pink)"/><rect x="680" y="294" width="190" height="65" rx="10" fill="#fff5f9" stroke="#d83988" stroke-width="1.7"/><text x="775.0" y="334" font-size="16" fill="#d83988" text-anchor="middle" font-weight="400">∂L/∂ŷ = 2</text><path d="M922,326 L882,326" fill="none" stroke="#d83988" stroke-width="2" marker-end="url(#pink)"/><rect x="930" y="294" width="135" height="65" rx="10" fill="#fff5f9" stroke="#d83988" stroke-width="1.7"/><text x="997.5" y="334" font-size="16" fill="#d83988" text-anchor="middle" font-weight="400">∂L/∂L = 1</text><rect x="180" y="395" width="300" height="66" rx="10" fill="#fff7d5" stroke="#455a64" stroke-width="1.7"/><text x="330" y="422" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Градиенты первого слоя</text><text x="330" y="447" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">∂L/∂w₁ = 6;  ∂L/∂b₁ = 6</text><rect x="630" y="395" width="330" height="66" rx="10" fill="#fff7d5" stroke="#455a64" stroke-width="1.7"/><text x="795" y="422" font-size="17" fill="#455a64" text-anchor="middle" font-weight="400">Градиенты последнего слоя</text><text x="795" y="447" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">∂L/∂w₂ = 4;  ∂L/∂b₂ = 2</text><text x="550" y="501" font-size="18" fill="#455a64" text-anchor="middle" font-weight="400">Сначала считаем все градиенты, затем обновляем параметры.</text></g></svg>