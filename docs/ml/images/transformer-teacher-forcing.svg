<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555"><title>Teacher forcing: вход сдвинут относительно правильного ответа</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#607781"/></marker></defs><rect width="1100" height="100%" rx="16" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#455a64"><text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#455a64">Обучение декодера: предыдущий токен → следующий</text><text x="150" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#455a64">Позиция</text><text x="360" y="100" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">1</text><text x="650" y="100" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">2</text><text x="940" y="100" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">3</text><text x="150" y="170" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">Вход</text><rect x="250" y="127" width="220" height="68" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="360" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">[BOS]</text><rect x="540" y="127" width="220" height="68" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="650" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">цена</text><rect x="830" y="127" width="220" height="68" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="940" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">растёт</text><text x="150" y="269" text-anchor="middle" font-size="21" font-weight="700" fill="#455a64">Доступно</text><path d="M360 201 L360 221" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="232" y="232" width="256" height="74" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="360" y="275" text-anchor="middle" font-size="19" font-weight="400" fill="#455a64">[BOS]</text><path d="M650 201 L650 221" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="522" y="232" width="256" height="74" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="650" y="275" text-anchor="middle" font-size="19" font-weight="400" fill="#455a64">[BOS], цена</text><path d="M940 201 L940 221" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="812" y="232" width="256" height="74" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="940" y="275" text-anchor="middle" font-size="19" font-weight="400" fill="#455a64">[BOS], цена, растёт</text><text x="150" y="382" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">Таргет</text><path d="M360 312 L360 333" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="250" y="342" width="220" height="68" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="360" y="385" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">цена</text><path d="M650 312 L650 333" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="540" y="342" width="220" height="68" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="650" y="385" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">растёт</text><path d="M940 312 L940 333" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="830" y="342" width="220" height="68" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="940" y="385" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">[EOS]</text><text x="550" y="455" text-anchor="middle" font-size="21" font-weight="400" fill="#455a64">Вход — правильные предыдущие элементы. Таргет — следующий элемент.</text><text x="550" y="491" text-anchor="middle" font-size="20" font-weight="400" fill="#d83988">Маска запрещает читать будущие входные позиции: ответ ещё не доступен.</text><text x="550" y="527" text-anchor="middle" font-size="19" font-weight="400" fill="#455a64">При генерации правильного префикса нет: добавляем выбранный моделью токен.</text></g></svg>