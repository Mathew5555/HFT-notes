<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><title>Внимание на числах: сравнить ключи, нормировать веса, сложить значения</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#607781"/></marker></defs><rect width="1100" height="100%" rx="16" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#455a64"><text x="550" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#455a64">Внимание на числах: от запроса к результату</text><rect x="40" y="84" width="180" height="102" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="130" y="119" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">Запрос q = 1</text><text x="130" y="153" text-anchor="middle" font-size="18" font-weight="400" fill="#455a64">dk = 1, √dk = 1</text><path d="M230 136 L280 136" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="295" y="84" width="345" height="102" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="467" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#455a64">Ключи k₁ = ln 3, k₂ = 0</text><text x="467" y="153" text-anchor="middle" font-size="19" font-weight="400" fill="#455a64">Оценки: qk / √dk = [ln 3, 0]</text><path d="M652 136 L704 136" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="720" y="84" width="340" height="102" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="890" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#455a64">Softmax</text><text x="890" y="153" text-anchor="middle" font-size="22" font-weight="400" fill="#455a64">[3, 1] / 4 = [0.75, 0.25]</text><text x="550" y="226" text-anchor="middle" font-size="20" font-weight="400" fill="#455a64">Оценки определяют доли; смешиваются отдельные векторы значений.</text><rect x="75" y="267" width="320" height="86" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="235" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#455a64">v₁ = [4, 0]</text><text x="235" y="331" text-anchor="middle" font-size="22" font-weight="400" fill="#455a64">0.75 · v₁ = [3, 0]</text><rect x="705" y="267" width="320" height="86" rx="12" fill="#e1f0f7" stroke="#607781" stroke-width="1.5"/><text x="865" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#455a64">v₂ = [0, 8]</text><text x="865" y="331" text-anchor="middle" font-size="22" font-weight="400" fill="#455a64">0.25 · v₂ = [0, 2]</text><path d="M398 309 L449 309" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M702 309 L651 309" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="465" y="267" width="170" height="86" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="550" y="320" text-anchor="middle" font-size="23" font-weight="700" fill="#455a64">Сложить</text><path d="M550 362 L550 392" stroke="#607781" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="404" width="420" height="76" rx="12" fill="#fff4bd" stroke="#607781" stroke-width="1.5"/><text x="550" y="450" text-anchor="middle" font-size="25" font-weight="700" fill="#455a64">z = [3, 0] + [0, 2] = [3, 2]</text></g></svg>